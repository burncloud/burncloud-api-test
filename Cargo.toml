[package]
name = "burncloud-api-test"
version = "0.1.1"
edition = "2021"
description = "A high-performance API testing tool supporting OpenAI, Azure OpenAI GPT, and Azure Claude models with comprehensive performance metrics"
license = "MIT"
authors = ["Your Name <your.email@example.com>"]
repository = "https://github.com/yourusername/burncloud-api-test"
homepage = "https://github.com/yourusername/burncloud-api-test"
keywords = ["api", "testing", "openai", "claude", "azure", "performance", "benchmark"]
categories = ["development-tools::testing", "command-line-utilities"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "stream", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenv = "0.15"
futures = "0.3"

[workspace]
members = [
    "crates/azure",
]